root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/driverlogs-api ./cmd/api"
  bin = "./tmp/driverlogs-api"
  delay = 1000
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "500ms"
  log = "air-build.log"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
